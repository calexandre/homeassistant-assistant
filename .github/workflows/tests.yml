name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: SSH read-only guard
        run: python -m unittest discover -s .github/hooks -p 'test_*.py' -v
      - name: Fetch script input checks
        run: python -m unittest discover -s .claude/skills/ha-config-fetch -p 'test_*.py' -v
      - name: Home map
        run: |
          python -m pip install --quiet pyyaml
          python -m unittest discover -s .claude/skills/ha-home-map -p 'test_*.py' -v
