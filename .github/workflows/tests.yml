name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: SSH read-only guard
        run: python -m unittest discover -s .github/hooks -p 'test_*.py' -v
      - name: Fetch script input checks
        run: python -m unittest discover -s tests/ha-config-fetch -p 'test_*.py' -v
      - name: Home map
        run: |
          python -m pip install --quiet pyyaml
          python -m unittest discover -s tests/ha-home-map -p 'test_*.py' -v
      - name: Demo home map is current
        run: |
          demo/build.sh
          git diff --exit-code --stat -- demo/assets/home-map.html \
            || { echo "::error file=demo/assets/home-map.html::Out of date: run demo/build.sh and commit the result"; exit 1; }
