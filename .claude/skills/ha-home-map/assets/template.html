<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--TITLE--></title>
<link rel="icon" href="data:,">
<style>
/*FONT_FACES*/

/* === Tokens: Home Assistant's default light and dark themes ============================ */
:root {
  color-scheme: light;
  --primary: #03a9f4;
  --primary-ink: #0277bd;
  --page: #fafafa;
  --card: #ffffff;
  --fill: #f0f0f0;
  --fill-strong: #e4e4e4;
  --text-1: #212121;
  --text-2: #727272;
  --text-3: #9e9e9e;
  --divider: rgba(0, 0, 0, 0.12);
  --outline: rgba(0, 0, 0, 0.24);
  --selected: rgba(3, 169, 244, 0.14);
  --plain-icon: #44739e;
  --logic: #212121;
  --logic-ink: #ffffff;
  --edge: #8a8a8a;
  --edge-hi: #212121;
  --c-1: #2a78d6;
  --c-2: #eb6834;
  --c-3: #1baf7a;
  --c-other: #9e9e9e;
  --scrim: rgba(0, 0, 0, 0.32);
  --toast: #323232;
  --shadow: 0 4px 16px rgba(0, 0, 0, 0.10);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --primary-ink: #4fc3f7;
    --page: #111111;
    --card: #1c1c1c;
    --fill: #262626;
    --fill-strong: #313131;
    --text-1: #e1e1e1;
    --text-2: #9b9b9b;
    --text-3: #6f6f6f;
    --divider: rgba(225, 225, 225, 0.12);
    --outline: rgba(225, 225, 225, 0.24);
    --selected: rgba(3, 169, 244, 0.22);
    --plain-icon: #7ba3c9;
    --logic: #e1e1e1;
    --logic-ink: #111111;
    --edge: #707070;
    --edge-hi: #e1e1e1;
    --c-1: #3987e5;
    --c-2: #d95926;
    --c-3: #199e70;
    --c-other: #7a7a7a;
    --scrim: rgba(0, 0, 0, 0.5);
    --toast: #e1e1e1;
    --shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --primary-ink: #4fc3f7;
  --page: #111111;
  --card: #1c1c1c;
  --fill: #262626;
  --fill-strong: #313131;
  --text-1: #e1e1e1;
  --text-2: #9b9b9b;
  --text-3: #6f6f6f;
  --divider: rgba(225, 225, 225, 0.12);
  --outline: rgba(225, 225, 225, 0.24);
  --selected: rgba(3, 169, 244, 0.22);
  --plain-icon: #7ba3c9;
  --logic: #e1e1e1;
  --logic-ink: #111111;
  --edge: #707070;
  --edge-hi: #e1e1e1;
  --c-1: #3987e5;
  --c-2: #d95926;
  --c-3: #199e70;
  --c-other: #7a7a7a;
  --scrim: rgba(0, 0, 0, 0.5);
  --toast: #e1e1e1;
  --shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
}

/* === Base =============================================================================== */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--page);
  color: var(--text-1);
  font: 400 14px/1.43 Roboto, Noto, system-ui, sans-serif;
  display: grid;
  grid-template-rows: 56px minmax(0, 1fr);
  height: 100dvh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
.mdi { width: 24px; height: 24px; fill: currentColor; flex: none; }
.mdi.sm { width: 18px; height: 18px; }
.mdi.xs { width: 16px; height: 16px; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
code, .mono { font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }

/* === Top app bar ======================================================================== */
.topbar {
  display: flex; align-items: center; gap: 8px; padding: 0 12px 0 4px;
  border-bottom: 1px solid var(--divider); background: var(--page); min-width: 0;
}
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--text-2);
  display: inline-grid; place-items: center; cursor: pointer; flex: none;
}
.icon-btn:hover { background: var(--fill); color: var(--text-1); }
.icon-btn[aria-pressed="true"] { color: var(--primary-ink); }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 0 1 auto; }
.brand h1 { font-size: 20px; font-weight: 400; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand .sub { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand > div { min-width: 0; line-height: 1.25; }
.search { position: relative; flex: 1 1 360px; max-width: 560px; margin: 0 auto; min-width: 120px; }
.search label { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px 0 12px; border-radius: 20px; background: var(--fill); color: var(--text-2); }
.search label:focus-within { background: var(--card); box-shadow: 0 0 0 2px var(--primary) inset; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 15px; color: var(--text-1); outline: none; }
.search input::placeholder { color: var(--text-2); }
.search kbd { font: 500 11px Roboto, sans-serif; color: var(--text-2); border: 1px solid var(--outline); border-radius: 4px; padding: 0 5px; }
.search .icon-btn { width: 32px; height: 32px; }
.results {
  position: absolute; top: 46px; left: 0; right: 0; z-index: 30; margin: 0; padding: 6px 0; list-style: none;
  background: var(--card); border: 1px solid var(--divider); border-radius: 12px; box-shadow: var(--shadow);
  max-height: min(480px, 70vh); overflow: auto;
}
.results li { display: flex; align-items: center; gap: 12px; padding: 7px 14px; cursor: pointer; }
.results li[aria-selected="true"], .results li:hover { background: var(--fill); }
.results .r-main { min-width: 0; }
.results .r-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.results .r-name b { font-weight: 500; color: var(--primary-ink); }
.results .r-sub { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.results .empty { color: var(--text-2); cursor: default; }
.actions { display: flex; align-items: center; gap: 4px; flex: none; }

/* Segmented buttons (Material 3, as in Home Assistant) */
.seg { display: inline-flex; border: 1px solid var(--outline); border-radius: 20px; overflow: hidden; height: 36px; }
.seg button {
  border: 0; background: transparent; padding: 0 14px; font-size: 14px; font-weight: 500; color: var(--text-1);
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap;
}
.seg button + button { border-left: 1px solid var(--outline); }
.seg button:hover { background: var(--fill); }
.seg button[aria-pressed="true"] { background: var(--selected); }
.seg button .check { display: none; }
.seg button[aria-pressed="true"] .check { display: block; }
.seg.full { display: flex; }
.seg.full button { flex: 1; justify-content: center; padding: 0 8px; }

/* === App layout ========================================================================= */
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 0; }
body.no-sidebar .app { grid-template-columns: 0 minmax(0, 1fr); }
body.no-sidebar .sidebar { visibility: hidden; }
.sidebar { overflow: auto; border-right: 1px solid var(--divider); padding: 12px 16px 24px; background: var(--page); }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; outline: none; }
#map.grabbing { cursor: grabbing; }
#map.pointer { cursor: pointer; }

/* Sidebar sections */
.group { padding: 8px 0 14px; border-bottom: 1px solid var(--divider); }
.group:last-of-type { border-bottom: 0; }
.group h2, .group summary { font-size: 14px; font-weight: 500; margin: 0; }
.field { margin-top: 10px; }
.field > span { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 6px; }
details.group > summary {
  list-style: none; display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 0; user-select: none;
}
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary .chev { transition: transform .2s; color: var(--text-2); }
details.group[open] > summary .chev { transform: rotate(180deg); }
.badge { font-size: 12px; font-weight: 500; color: var(--primary-ink); background: var(--selected); border-radius: 10px; padding: 0 8px; line-height: 20px; }
.summary-spacer { flex: 1; }
.link-btn { border: 0; background: none; color: var(--primary-ink); font-size: 13px; font-weight: 500; padding: 2px 4px; cursor: pointer; border-radius: 4px; }
.link-btn:hover { background: var(--fill); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 10px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px 0 8px; border-radius: 8px;
  border: 1px solid var(--outline); background: transparent; color: var(--text-3); font-size: 13px; font-weight: 500;
  cursor: pointer; max-width: 100%;
}
.chip .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .n { font-weight: 400; color: var(--text-3); }
.chip[aria-pressed="true"] { background: var(--selected); border-color: transparent; color: var(--text-1); }
.chip[aria-pressed="true"] .n { color: var(--text-2); }
.chip:hover { border-color: var(--text-2); }
.chip .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 18px;
  border: 1px solid var(--outline); background: transparent; color: var(--primary-ink); font-weight: 500; cursor: pointer;
}
.btn:hover { background: var(--selected); }
.btn.reset { width: 100%; margin-top: 12px; display: none; }
.btn.reset.show { display: flex; }
.foot { font-size: 12px; color: var(--text-2); padding-top: 14px; }
.foot details { margin-top: 8px; }
.foot summary { cursor: pointer; color: var(--text-1); }
.foot ul { margin: 6px 0 0; padding-left: 18px; }

/* === Map overlays ======================================================================= */
.card { background: var(--card); border: 1px solid var(--divider); border-radius: 12px; }
.legend { font-size: 13px; color: var(--text-2); }
.legend .rows { display: grid; gap: 8px; padding-top: 10px; }
.legend .row { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.legend .item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend .dot { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; }
.legend .dot .mdi { width: 14px; height: 14px; }
.legend .sq { width: 20px; height: 20px; border-radius: 6px; background: var(--logic); color: var(--logic-ink); display: inline-grid; place-items: center; }
.legend .sq .mdi { width: 14px; height: 14px; }
.legend svg.line { width: 28px; height: 10px; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; overflow: hidden; z-index: 5; transition: right .2s; }
.zoom button { width: 40px; height: 40px; border: 0; background: transparent; color: var(--text-2); display: grid; place-items: center; cursor: pointer; }
.zoom button + button { border-top: 1px solid var(--divider); }
.zoom button:hover { background: var(--fill); color: var(--text-1); }
body.panel-open .zoom { right: 384px; }
.status {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 6; padding: 6px 14px; font-size: 13px;
  color: var(--text-2); display: none; align-items: center; gap: 8px;
}
.status.show { display: inline-flex; }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--divider); border-top-color: var(--primary); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#tip {
  position: fixed; z-index: 40; pointer-events: none; max-width: 280px; padding: 6px 10px; border-radius: 8px;
  background: var(--toast); color: var(--page); font-size: 12px; display: none; box-shadow: var(--shadow);
}
#tip b { font-weight: 500; display: block; font-size: 13px; }

/* Details panel, like Home Assistant's more-info dialog */
.panel {
  position: absolute; top: 12px; right: 12px; bottom: 12px; width: 360px; z-index: 10; display: flex; flex-direction: column;
  box-shadow: var(--shadow); overflow: hidden;
}
.panel[hidden] { display: none; }
.panel-head { display: flex; align-items: flex-start; gap: 12px; padding: 14px 8px 12px 16px; border-bottom: 1px solid var(--divider); }
.panel-head .titles { flex: 1; min-width: 0; padding-top: 2px; }
.panel-head h2 { font-size: 18px; font-weight: 500; margin: 0; line-height: 1.3; overflow-wrap: anywhere; }
.panel-head .sub { color: var(--text-2); font-size: 13px; }
.panel-body { overflow: hidden auto; padding: 4px 0 16px; }
.panel-body .desc { padding: 10px 16px 0; color: var(--text-2); }
.glyph { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.glyph.logic { border-radius: 12px; background: var(--logic); color: var(--logic-ink); }
.glyph.area { border-radius: 12px; background: var(--fill); color: var(--text-2); }
.glyph.mini { width: 28px; height: 28px; }
.glyph.mini .mdi { width: 17px; height: 17px; }
.glyph.mini.logic { border-radius: 8px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; padding: 12px 16px 4px; font-size: 13px; }
.facts dt { color: var(--text-2); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; display: flex; align-items: center; gap: 6px; }
.sec { padding: 12px 0 0; }
.sec h3 { font-size: 12px; font-weight: 500; color: var(--text-2); margin: 0 16px 4px; letter-spacing: 0.02em; display: flex; gap: 6px; }
.sec h3 .n { color: var(--text-3); font-weight: 400; }
.row-btn {
  width: 100%; display: flex; align-items: center; gap: 12px; padding: 6px 12px 6px 16px; border: 0; background: none;
  text-align: left; cursor: pointer; min-height: 44px;
}
.row-btn:hover { background: var(--fill); }
.row-btn .main { flex: 1; min-width: 0; }
.row-btn .name { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-btn .meta { display: block; font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-btn > .mdi { color: var(--text-3); }
.ents { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 16px 0; }
.ent {
  border: 1px solid var(--divider); background: var(--page); border-radius: 6px; padding: 3px 8px; cursor: copy;
  color: var(--text-1); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ent:hover { border-color: var(--primary); }
.ents:not(.all) .ent.extra { display: none; }
.copy-id { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0; cursor: copy; color: var(--text-1); text-align: left; overflow-wrap: anywhere; }
.copy-id .mdi { color: var(--text-3); }

/* === Table view ========================================================================= */
.tableview { position: absolute; inset: 0; overflow: auto; background: var(--page); padding: 12px 16px 24px; z-index: 8; }
.tableview[hidden] { display: none; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--divider); margin-bottom: 12px; }
.tabs button { border: 0; background: none; padding: 10px 16px; font-weight: 500; color: var(--text-2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--primary-ink); border-bottom-color: var(--primary); }
.tablenote { font-size: 12px; color: var(--text-2); margin: 0 0 8px; }
.tablecard { overflow: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--divider); vertical-align: top; }
th { font-weight: 500; color: var(--text-2); position: sticky; top: 0; background: var(--card); white-space: nowrap; }
th button { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
th[aria-sort] button { color: var(--text-1); }
th .mdi { width: 16px; height: 16px; opacity: 0; }
th[aria-sort] .mdi { opacity: 1; }
th[aria-sort="descending"] .mdi { transform: rotate(180deg); }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--fill); }
td .cell-name { display: flex; align-items: center; gap: 10px; min-width: 200px; }
td.num { font-variant-numeric: tabular-nums; }
td .muted { color: var(--text-3); }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; z-index: 50; pointer-events: none;
  background: var(--toast); color: var(--page); padding: 10px 16px; border-radius: 8px; font-size: 14px; transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.scrim { display: none; }

/* === Narrow screens: the filters become a drawer and the details panel a bottom sheet ==== */
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar {
    position: fixed; top: 56px; bottom: 0; left: 0; width: min(320px, 88vw); z-index: 35; transform: translateX(-105%);
    transition: transform .25s; box-shadow: var(--shadow);
  }
  body.drawer .sidebar { transform: none; }
  body.no-sidebar .sidebar { visibility: visible; }
  body.drawer .scrim { display: block; position: fixed; inset: 56px 0 0; background: var(--scrim); z-index: 34; }
  .brand .sub, .brand h1, .search kbd, #view-seg .txt { display: none; }
  .search { margin: 0; }
  .panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 55%; }
  body.panel-open .zoom { right: 12px; bottom: calc(55% + 20px); }
}
@media (max-width: 520px) {
  .topbar { gap: 2px; padding-right: 4px; }
  .brand { display: none; }
  #png { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<header class="topbar">
  <button class="icon-btn" id="menu" aria-label="Show or hide filters" aria-controls="sidebar" aria-pressed="true"></button>
  <div class="brand">
    <span class="mdi-slot" data-icon="mdi:floor-plan" style="color:var(--primary)"></span>
    <div><h1><!--TITLE--></h1><div class="sub" id="stats"></div></div>
  </div>
  <div class="search" role="search">
    <label>
      <span class="mdi-slot" data-icon="mdi:magnify"></span>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search devices, automations, entity IDs"
        role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list" aria-label="Search the map">
      <kbd aria-hidden="true">/</kbd>
      <button class="icon-btn" id="q-clear" aria-label="Clear search" hidden></button>
    </label>
    <ul class="results" id="results" role="listbox" aria-label="Search results" hidden></ul>
  </div>
  <div class="actions">
    <div class="seg" id="view-seg" role="group" aria-label="View">
      <button id="view-map" aria-pressed="true"><span class="mdi-slot sm" data-icon="mdi:graph-outline"></span><span class="txt">Map</span></button>
      <button id="view-table" aria-pressed="false"><span class="mdi-slot sm" data-icon="mdi:table"></span><span class="txt">Table</span></button>
    </div>
    <button class="icon-btn" id="png" aria-label="Download the map as a PNG image" title="Download PNG"></button>
    <button class="icon-btn" id="theme" aria-label="Switch between light and dark theme" title="Theme"></button>
  </div>
</header>

<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Display and filters">
    <section class="group">
      <h2>Display</h2>
      <div class="field"><span id="lbl-scope">Devices</span>
        <div class="seg full" role="group" aria-labelledby="lbl-scope">
          <button id="scope-all" aria-pressed="true"><span class="mdi-slot sm check" data-icon="mdi:check"></span>All</button>
          <button id="scope-linked" aria-pressed="false"><span class="mdi-slot sm check" data-icon="mdi:check"></span>Automated only</button>
        </div>
      </div>
      <div class="field"><span id="lbl-color">Icon color</span>
        <div class="seg full" role="group" aria-labelledby="lbl-color">
          <button id="color-connection" aria-pressed="true"><span class="mdi-slot sm check" data-icon="mdi:check"></span>Connection</button>
          <button id="color-plain" aria-pressed="false"><span class="mdi-slot sm check" data-icon="mdi:check"></span>Plain</button>
        </div>
      </div>
      <button class="btn reset" id="reset"><span class="mdi-slot sm" data-icon="mdi:restore"></span>Show everything</button>
    </section>
    <section class="group legend" id="legend" aria-label="Legend"></section>
    <div id="filters"></div>
    <div class="foot" id="foot"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="stage" id="stage">
    <canvas id="map" tabindex="0" role="img" aria-label="Map of areas, devices, and automations"></canvas>
    <div class="status card" id="status" role="status"><span class="spinner"></span><span id="status-text">Laying out the map…</span></div>
    <div class="zoom card" role="group" aria-label="Zoom">
      <button id="zoom-in" aria-label="Zoom in" title="Zoom in (+)"></button>
      <button id="zoom-out" aria-label="Zoom out" title="Zoom out (−)"></button>
      <button id="zoom-fit" aria-label="Fit the map to the screen" title="Fit (0)"></button>
    </div>
    <section class="panel card" id="panel" aria-label="Details" hidden></section>
    <section class="tableview" id="tableview" hidden>
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-logic" aria-selected="true">Automations, scripts &amp; scenes</button>
        <button role="tab" id="tab-devices" aria-selected="false">Devices</button>
      </div>
      <p class="tablenote" id="tablenote"></p>
      <div class="card tablecard"><table id="table"></table></div>
    </section>
  </main>
</div>

    { x1: Infinity, y1: Infinity, x2: -Infinity, y2: -Infinity });
  if (b.x1 === Infinity) b = { x1: 0, y1: 0, x2: 1, y2: 1 };
  b = { ...b, w: b.x2 - b.x1, h: b.y2 - b.y1, cx: (b.x1 + b.x2) / 2, cy: (b.y1 + b.y2) / 2 };
  const f = fitFor(b);
  kMin = Math.min(f.k * 0.5, 0.3);
  if (moves.length) anim.layout = { moves, t0: performance.now(), dur: 650 };
  if (after) {
    if (moves.length) for (const [n, , to] of moves) { n.x = to.x; n.y = to.y; }
    anim.layout = null;
    updateBoxes();
    after();
  } else flyTo(f.cx, f.cy, f.k, !layoutDone);
  layoutDone = true;
  status(false);
  invalidate();
}
function status(on, text) {
  $("#status").classList.toggle("show", on);
  if (text) $("#status-text").textContent = text;
}

function toggleSidebar(force) {
  const narrow = innerWidth <= 900;
  if (narrow) {
    const open = force ?? !document.body.classList.contains("drawer");
    document.body.classList.toggle("drawer", open);
    $("#menu").setAttribute("aria-pressed", String(open));
  } else {
    const hide = force === undefined ? !document.body.classList.contains("no-sidebar") : !force;
    document.body.classList.toggle("no-sidebar", hide);
    $("#menu").setAttribute("aria-pressed", String(!hide));
    store.set("sidebar", !hide);
  }
}
$("#menu").onclick = () => toggleSidebar();
$("#scrim").onclick = () => toggleSidebar(false);
if (innerWidth > 900 && store.get("sidebar") === false) toggleSidebar(false);
if (innerWidth <= 900) $("#menu").setAttribute("aria-pressed", "false");

/* === Legend, stats, footer =============================================================== */
function renderLegend() {
  const folded = Object.keys(protoCount).filter((p) => !colored.includes(p)).map((p) => (PROTOCOLS[p] || PROTOCOLS.other).label);
  const dot = (v, icon) => `<span class="dot" style="color:var(${v});background:color-mix(in srgb, var(${v}) 18%, transparent)">${svg(icon)}</span>`;
  const protoRow = F.color === "plain" ? "" : `<div class="row">${colored.map((p) => `<span class="item">${dot(slot(p), PROTOCOLS[p].icon)}${esc(PROTOCOLS[p].label)}</span>`).join("")}` +
    (folded.length ? `<span class="item">${dot("--c-other", "mdi:cloud-outline")}${esc(folded.join(", "))}</span>` : "") + `</div>`;
  const line = (dash, arrow) => `<svg class="line" viewBox="0 0 28 10" aria-hidden="true"><path d="M1 5H${arrow ? 21 : 27}" stroke="var(--edge-hi)" stroke-width="1.6" stroke-linecap="round" fill="none"${dash ? ` stroke-dasharray="${dash}"` : ""}/>${arrow ? `<path d="M27 5l-6-3.5v7z" fill="var(--edge-hi)"/>` : ""}</svg>`;
  $("#legend").innerHTML = `<h2>Legend</h2><div class="rows">${protoRow}` +
    `<div class="row"><span class="item"><span class="sq">${svg("mdi:robot")}</span>Automation</span><span class="item"><span class="sq">${svg("mdi:script-text")}</span>Script</span><span class="item"><span class="sq">${svg("mdi:palette")}</span>Scene</span></div>` +
    `<div class="row"><span class="item">${line("4 3.5")}triggers</span><span class="item">${line("", true)}controls</span><span class="item">${line("0.5 3.5", true)}runs</span></div></div>`;
}
function renderStats() {
  const s = G.stats, v = (kind) => LEAVES.filter((n) => n.kind === kind && n.vis).length;
  const parts = [[AREAS.filter((a) => a.vis && !a.virtual).length, s.areas, "areas"], [v("device"), s.devices, "devices"],
    [v("automation"), s.automations, "automations"], [v("script"), s.scripts, "scripts"], [v("scene"), s.scenes, "scenes"]];
  $("#stats").textContent = parts.filter(([, total]) => total).map(([n, total, label]) => (n === total ? plural(total, label) : `${n} of ${plural(total, label)}`)).join(" · ");
  canvas.setAttribute("aria-label", `Map of ${$("#stats").textContent}. Use the search or the table view for a text version.`);
}
function renderFoot() {
  const s = G.stats;
  $("#foot").innerHTML = `Generated ${esc(G.meta.generated)} from the Home Assistant registries and the automation, script, and scene YAML.` +
    (s.not_on_map && s.not_on_map.length ? `<details><summary>${plural(s.not_on_map.length, "automations")} ${s.not_on_map.length === 1 ? "touches" : "touch"} no device</summary><ul>${s.not_on_map.map((n) => `<li>${esc(n)}</li>`).join("")}</ul></details>` : "");
}

/* === Table view ========================================================================== */
let tab = "logic", sort = { logic: ["area", 1], devices: ["area", 1] };
const COLUMNS = {
  logic: [
    ["name", "Name", (n) => n.label], ["kind", "Kind", (n) => KIND[n.kind]], ["area", "Area", areaName],
    ["trig", "Triggered by", (n) => n.inn.filter((e) => e.kind === "trigger").map((e) => e.s.label).join(", ")],
    ["ctrl", "Controls and runs", (n) => n.out.map((e) => e.t.label).join(", ")],
  ],
  devices: [
    ["name", "Name", (n) => n.label], ["type", "Type", (n) => n.type_label], ["area", "Area", areaName],
    ["proto", "Connection", (n) => (PROTOCOLS[n.protocol] || PROTOCOLS.other).label], ["int", "Integration", (n) => n.integration],
    ["used", "Used by", (n) => n.deg],
  ],
};
function renderTable() {
  const cols = COLUMNS[tab], [key, dir] = sort[tab];
  const col = cols.find((c) => c[0] === key) || cols[0];
  const s = q.value.trim() ? new Set(found.map((n) => n.id)) : null;
  const all = LEAVES.filter((n) => (tab === "logic" ? isLogic(n) : n.kind === "device"));
  const rows = all.filter((n) => n.vis && (!s || s.has(n.id))).sort((a, b) => {
    const x = col[2](a), y = col[2](b);
    const c = typeof x === "number" ? x - y : String(x).localeCompare(String(y));
    return (c || a.label.localeCompare(b.label)) * dir;
  });
  $("#tablenote").textContent = rows.length === all.length ? `${rows.length} rows` : `${rows.length} of ${all.length} rows, filtered by ${s ? "the search" : ""}${s && anyHidden() ? " and " : ""}${anyHidden() ? "the filters" : ""}`;
  $("#table").innerHTML = `<thead><tr>${cols.map((c) => `<th${c[0] === key ? ` aria-sort="${dir > 0 ? "ascending" : "descending"}"` : ""}><button data-sort="${c[0]}">${esc(c[1])}${svg("mdi:chevron-down", "xs")}</button></th>`).join("")}</tr></thead>` +
    `<tbody>${rows.map((n) => `<tr data-go="${esc(n.id)}">${cols.map((c, i) => {
      const v = c[2](n);
      if (i === 0) return `<td><span class="cell-name">${glyphHtml(n, true)}<span>${esc(v)}</span></span></td>`;
      return `<td${typeof v === "number" ? ' class="num"' : ""}>${v === "" ? '<span class="muted">—</span>' : esc(v)}</td>`;
    }).join("")}</tr>`).join("")}</tbody>`;
}
$("#table").addEventListener("click", (ev) => {
  const th = ev.target.closest("[data-sort]");
  if (th) {
    const [key, dir] = sort[tab];
    sort[tab] = [th.dataset.sort, key === th.dataset.sort ? -dir : 1];
    renderTable();
    return;
  }
  const tr = ev.target.closest("tr[data-go]");
  if (tr) go(tr.dataset.go);
});
for (const [id, name] of [["#tab-logic", "logic"], ["#tab-devices", "devices"]]) {
  $(id).onclick = () => {
    tab = name;
    $("#tab-logic").setAttribute("aria-selected", String(name === "logic"));
    $("#tab-devices").setAttribute("aria-selected", String(name === "devices"));
    renderTable();
  };
}
function setView(table) {
  $("#view-map").setAttribute("aria-pressed", String(!table));
  $("#view-table").setAttribute("aria-pressed", String(table));
  $("#tableview").hidden = !table;
  $("#png").hidden = table;
  if (table) { select(null); renderTable(); }
  else invalidate();
}
$("#view-map").onclick = () => setView(false);
$("#view-table").onclick = () => setView(true);

/* === PNG export ========================================================================== */
$("#png").onclick = () => {
  const b = worldBounds(), pad = 40;
  const k = Math.min(1.1, 9000 / (b.w + pad * 2), 9000 / (b.h + pad * 2));
  const w = Math.ceil(b.w * k + pad * 2), h = Math.ceil(b.h * k + pad * 2);
  const scale = Math.min(2, Math.sqrt(60e6 / (w * h)));
  const off = document.createElement("canvas");
  off.width = Math.round(w * scale); off.height = Math.round(h * scale);
  const keepDpr = DPR, keepSel = selected, keepHover = hovered, keepHits = hits;
  DPR = scale; selected = null; hovered = null; hits = null; focusCache.key = null;
  draw(off.getContext("2d"), { k, x: pad - b.x1 * k, y: pad - b.y1 * k }, w, h, true, 0);
  DPR = keepDpr; selected = keepSel; hovered = keepHover; hits = keepHits; focusCache.key = null;
  for (const n of LEAVES) n.la = 0;
  off.toBlob((blob) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "home-map.png"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  });
  invalidate();
};

/* === Theme =============================================================================== */
const savedTheme = store.get("theme");
if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
$("#theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const now = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  document.documentElement.dataset.theme = now === "dark" ? "light" : "dark";
  store.set("theme", document.documentElement.dataset.theme);
  readTokens(); invalidate();
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readTokens(); invalidate(); });

/* === Start =============================================================================== */
function resize() {
  const r = stage.getBoundingClientRect();
  // Keep the selected node, or else the middle of the map, in the middle after the window changes shape.
  let keep = null;
  if (layoutDone && W > 1) {
    const c = clearArea();
    keep = selected && selected.kind !== "area" ? { x: selected.x, y: selected.y }
      : { x: (c.x + c.w / 2 - view.x) / view.k, y: (c.y + c.h / 2 - view.y) / view.k };
  }
  DPR = window.devicePixelRatio || 1;
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  if (keep) { const c = clearArea(); view.x = c.x + c.w / 2 - keep.x * view.k; view.y = c.y + c.h / 2 - keep.y * view.k; }
  invalidate();
}
new ResizeObserver(resize).observe(stage);
readTokens();
renderFilters();
renderLegend();
renderFoot();
applyVisibility();
renderStats();
resize();
status(true);
const fontsReady = document.fonts && document.fonts.load
  ? Promise.race([Promise.all([document.fonts.load(FONT.label), document.fonts.load(FONT.strong)]), new Promise((r) => setTimeout(r, 1500))])
  : Promise.resolve();
fontsReady.then(() => setTimeout(() => { widthCache.clear(); fitCache.clear(); relayout(false); }, 0));
window.homeMap = { nodes, edges, view, byId, select: (id) => select(byId.get(id), true), go };
})();
</script>
</body>
